# muxtastic on an OpenStick. Not enabled by default: set the node's address
# below, then `systemctl enable --now muxtastic`.
# Only loopback listeners, so neither the hotspot nor the LTE side can reach the
# web UI (it has no login) or port 4404. Publish them on a private network
# yourself, e.g. with Tailscale (never `tailscale funnel`):
#   tailscale serve --bg --https=8443 http://127.0.0.1:8090
#   tailscale serve --bg --tcp=4404 tcp://127.0.0.1:4404
# dongie's Mesh tab reads the API on 127.0.0.1:8090 either way.

[node]
type = "tcp"
# The Meshtastic node with Wi-Fi, joined to the stick's hotspot (br0,
# 192.168.100.0/24). dnsmasq hands out .10-.99; give the node a fixed
# address outside that pool, e.g. in /etc/dnsmasq.d/meshtastic.conf:
#   dhcp-host=<node MAC>,192.168.100.50
tcp_host = "192.168.100.50"
tcp_port = 4403
tcp_idle_timeout_secs = 300

[node.reconnect]
enabled = true
initial_delay_secs = 1
max_delay_secs = 60
multiplier = 2

[server]
host = "127.0.0.1"
port = 4404
max_clients = 8

[virtual_node]
long_name = "openstick mux"
short_name = "MUX"
sync_physical_identity = true

[security]
# Clients arrive through tailscale serve, i.e. from 127.0.0.1: an address
# allowlist can't tell them apart, so remote admin stays blocked.
blocked_portnums = ["ADMIN_APP"]
allow_admin_from = []

[discovery]
enabled = false

[web]
enabled = true
host = "127.0.0.1"
port = 8090
storage = "memory"              # RAM only, nothing on flash
database = ""
retention_days = 1
try_all_one_byte_keys = false
map_tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
map_attribution = "© OpenStreetMap contributors"

[web.mqtt]
enabled = false

[mqtt_bridge]
enabled = false                 # every byte goes over LTE: only turn on deliberately

[logging]
level = "warning"
file = ""                       # journal only
console = true
